name: SimpanNota CI/CD Pipeline (200 UT -> Auto Build -> Deploy Live)

on:
  push:
    branches:
      - v1.0_dev
      - main
      - V1.1
  pull_request:
    branches:
      - v1.0_dev
      - main
      - V1.1

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # JOB 1: Gated Quality Check (200+ Unit Tests Hijau & Linter 0 Issues)
  # =========================================================================
  unit-test-200:
    name: 1. Unit & Widget Testing (200+ Test Cases)
    runs-on: ubuntu-latest
    steps:
      - name: 1.1 Checkout Source Code
        uses: actions/checkout@v4

      - name: 1.2 Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 1.3 Setup Flutter SDK Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 1.4 Unduh Dependencies (flutter pub get)
        run: flutter pub get

      - name: 1.5 Static Code Analysis (flutter analyze)
        run: flutter analyze

      - name: 1.6 Eksekusi 200+ Unit & Widget Tests
        run: flutter test --reporter expanded

  # =========================================================================
  # JOB 2: Auto Build Release APK (Hanya berjalan jika Job 1 LULUS 100%)
  # =========================================================================
  auto-build-apk:
    name: 2. Auto Build Release APK
    needs: unit-test-200
    runs-on: ubuntu-latest
    steps:
      - name: 2.1 Checkout Source Code
        uses: actions/checkout@v4

      - name: 2.2 Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 2.3 Setup Flutter SDK Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 2.4 Persiapkan Environment Configuration (.env)
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "SUPABASE_URL=https://qycksxjnohxvyxgjtusw.supabase.co" > .env
            echo "SUPABASE_ANON_KEY=sb_publishable__UyBuJM44f3YybZoje4Lhg_iTrfHVqz" >> .env
          fi

      - name: 2.5 Unduh Dependencies (flutter pub get)
        run: flutter pub get

      - name: 2.6 Kompilasi APK Produksi (flutter build apk --release)
        run: flutter build apk --release

      - name: 2.7 Simpan Artifact APK Build
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # JOB 3: Deploy Live Release (Hanya berjalan jika Job 1 & 2 Berhasil)
  # =========================================================================
  deploy-live-release:
    name: 3. Deploy Live Release & GitHub Artifact
    needs: [unit-test-200, auto-build-apk]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 3.1 Checkout Source Code
        uses: actions/checkout@v4

      - name: 3.2 Unduh Binary Artifact APK dari Job 2
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-artifacts

      - name: 3.3 Tentukan Metadata Rilis Berdasarkan Branch
        id: release_meta
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Current Branch: $BRANCH_NAME"
          
          if [ "$BRANCH_NAME" = "V1.1" ]; then
            echo "tag_name=v1.1.0-live" >> $GITHUB_OUTPUT
            echo "release_name=SimpanNota V1.1 Live Release (Production)" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          elif [ "$BRANCH_NAME" = "v1.0_dev" ]; then
            echo "tag_name=v1.0.1-dev-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "release_name=SimpanNota v1.0_dev Staging (Under Testing)" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v1.0.0-rc-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "release_name=SimpanNota Build #${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: 3.4 Publikasikan GitHub Release & Lampirkan APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.release_meta.outputs.is_prerelease == 'true' }}
          files: release-artifacts/app-release.apk
          body: |
            ### 🚀 SimpanNota Automated Build & Release
            
            - **Target Branch:** `${{ github.ref_name }}`
            - **Commit SHA:** `${{ github.sha }}`
            - **Pipeline Status:** ✅ 200+ Unit Tests PASSED -> Auto Build APK SUCCESS -> Deployed
            - **Status Rilis:** ${{ steps.release_meta.outputs.is_prerelease == 'true' && '🧪 Staging Prerelease (Under Testing)' || '🎉 Live Production Release' }}
            
            #### 📦 Lampiran Berkas:
            - `app-release.apk` siap diunduh dan dipasang pada perangkat Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
